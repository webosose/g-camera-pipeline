    "license": "Copyright (c) 2023 LG Electronics, Inc.",
    "platform": "Emulator for qemux86",
    "gst_elements": [
        {
            "pipeline-type": "JpegPipeline",
            "jpeg-decoder": {
                "name": "jpegdec"
            },
            "video-converter": {
                "name": "videoconvert"
            },
            "video-sink": {
                "name": "waylandsink",
                "properties": {
                    "sync": false
                }
            }
        },
        {
            "pipeline-type": "YuvPipeline",
            "video-converter": {
                "name": "videoconvert",
                "properties": {
                    "qos": false
                }
            },
            "video-sink": {
                "name": "waylandsink",
                "properties": {
                    "sync": false
                }
            }
        }
    ]
}
